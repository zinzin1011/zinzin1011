<svg xmlns="http://www.w3.org/2000/svg" fill="none" overflow="visible">
  <style>
    @keyframes fishman-14-hand-move {
    0% {
    transform: translate(2px, 3px) rotate(-10deg);
    }
    50% {
    transform: translate(2px, 3px) rotate(10deg);
    }
    100% {
    transform: translate(2px, 3px) rotate(-10deg);
    }
    }

    @keyframes fishman-14-leg-left-move {
    0% {
    transform: translate(3px, 13px);
    }
    50% {
    transform: translate(3px, 13px) rotate(10deg);
    }
    100% {
    transform: translate(3px, 13px);
    }
    }

    @keyframes fishman-14-leg-right-move {
    0% {
    transform: translate(6px, 13px);
    }
    50% {
    transform: translate(6px, 13px) rotate(-10deg);
    }
    100% {
    transform: translate(6px, 13px);
    }
    }

    @keyframes fishman-14-eyelid-left-move {
    0% {
    transform: translate(0.2px, 3px) scaleY(0);
    }
    50% {
    transform: translate(0.2px, 3.7px) scaleY(-1.17);
    }
    100% {
    transform: translate(0.2px, 3px) scaleY(0);
    }
    }

    @keyframes fishman-14-eyelid-right-move {
    0% {
    transform: translate(2.2px, 3px) scaleY(0);
    }
    50% {
    transform: translate(2.2px, 3.7px) scaleY(-1.17);
    }
    100% {
    transform: translate(2.2px, 3px) scaleY(0);
    }
    }

    @keyframes fishman-14-walk {
    0% {
    transform: translate(0px, 15px) scaleX(1);
    }
    49% {
    transform: translate(53px, 15px) scaleX(1);
    }
    50% {
    transform: translate(53px, 15px) scaleX(-1);
    }
    99% {
    transform: translate(0px, 15px) scaleX(-1);
    }
    100% {
    transform: translate(0px, 15px) scaleX(1);
    }
    }

    #fishman-14-leg-left {
    animation-name:fishman-14-leg-left-move;
    animation-duration:1s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    }

    #fishman-14-leg-right {
    animation-name:fishman-14-leg-right-move;
    animation-duration:1s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    }

    #fishman-14-hand {
    animation-name:fishman-14-hand-move;
    animation-duration:2s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    }

    #fishman-14-eyelid-left {
    animation-name:fishman-14-eyelid-left-move;
    animation-duration:3s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    }

    #fishman-14-eyelid-right {
    animation-name:fishman-14-eyelid-right-move;
    animation-duration:3s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    }

    #fishman-14 {
    animation-name:fishman-14-walk;
    animation-duration:4s;
    animation-iteration-count:infinite;
    animation-timing-function: ease-in-out;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    }
  </style>
